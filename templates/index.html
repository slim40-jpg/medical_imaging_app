{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3>Importer une image médicale</h3>
        <p class="text-muted">MedSAM nécessite que vous dessiniez un rectangle autour de la zone à segmenter.</p>
        <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
          <input class="form-control mb-3" type="file" name="image" accept="image/*" required>
          <button type="submit" class="btn btn-primary w-100">Continuer vers le dessin</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
